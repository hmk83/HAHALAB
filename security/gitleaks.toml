title = "HAHALAB secret detection; upstream rules retained"
[extend]
useDefault = true
[[rules]]
id = "hahalab-supabase-personal-token"
description = "Supabase personal access token"
regex = '''\bsbp_[A-Za-z0-9]{20,}\b'''
keywords = ["sbp_"]
[[rules]]
id = "hahalab-supabase-secret-key"
description = "Supabase server secret key"
regex = '''\bsb_secret_[A-Za-z0-9_-]{12,}\b'''
keywords = ["sb_secret_"]

# Supabase publishable keys identify the project and are intentionally browser-safe.
# This exception applies only to the generic rule and only to this public prefix.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Public Supabase publishable keys; never server secrets or PATs"
regexes = ['''^sb_publishable_[A-Za-z0-9_-]+$''']
